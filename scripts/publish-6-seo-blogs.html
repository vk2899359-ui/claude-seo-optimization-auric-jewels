<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Auric Jewels — Publish 6 SEO Blog Articles (April 2026)</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',sans-serif;background:#0B1F3A;color:#F5F1E8;padding:2rem;min-height:100vh}
h1{font-size:1.5rem;margin-bottom:.5rem;color:#C9A14A}
.sub{color:rgba(245,241,232,.5);margin-bottom:1.5rem;font-size:.9rem}
#start{background:linear-gradient(135deg,#C9A14A,#D4B56A);color:#0B1F3A;border:none;padding:14px 40px;border-radius:50px;font-weight:700;font-size:1rem;cursor:pointer;margin-bottom:2rem}
#start:hover{box-shadow:0 8px 24px rgba(201,161,74,.4)}
#start:disabled{opacity:.5;cursor:not-allowed}
.counter{margin-bottom:1rem;font-size:1.1rem;color:#C9A14A;font-weight:600}
.log{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:1.5rem;max-height:70vh;overflow-y:auto;font-family:'Consolas','Courier New',monospace;font-size:.82rem;line-height:1.9}
.ok{color:#4ADE80}.fail{color:#F87171}.info{color:#C9A14A}.dim{color:rgba(245,241,232,.4)}.warn{color:#FBBF24}
</style>
</head>
<body>
<h1>Auric Jewels — Publish 6 New SEO Blog Articles</h1>
<p class="sub">Creates pages via Saleor pageCreate mutation + adds type=blog metadata.</p>
<div class="counter" id="counter">Ready — click to publish all 6 articles</div>
<button id="start" onclick="run()">Publish All 6 Articles</button>
<div class="log" id="log"></div>

<script>
const API = "https://auric.thecodemesh.online/graphql/";
const TOKEN = "fAPR16BVrzI4thcLtj8c4tUUG1wGU6";
const PAGE_TYPE_ID = "UGFnZVR5cGU6Ng==";

const log = document.getElementById("log");
const counter = document.getElementById("counter");
const btn = document.getElementById("start");

function out(msg, cls = "") {
  log.innerHTML += `<div class="${cls}">${msg}</div>`;
  log.scrollTop = log.scrollHeight;
}
function esc(s) { return s.replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

async function gql(query, variables) {
  const body = { query };
  if (variables) body.variables = variables;
  const r = await fetch(API, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + TOKEN },
    body: JSON.stringify(body)
  });
  return r.json();
}

// ── All 6 articles with inline HTML content ──────────────

const ARTICLES = [
{
  title: "Lightweight Gold Jewellery for Working Women — Daily Wear Guide 2026",
  slug: "lightweight-gold-jewellery-working-women-daily-wear",
  metaTitle: "Lightweight Gold Jewellery Working Women | Auric Jewels Gurgaon",
  metaDescription: "Discover the best lightweight gold jewellery for working women — daily wear studs, chains, pendants & bangles in 18K/22K gold. Visit Auric Jewels Gurgaon.",
},
{
  title: "Lab-Grown vs Natural Diamonds — Complete Comparison Guide India 2026",
  slug: "lab-grown-vs-natural-diamonds-comparison-india",
  metaTitle: "Lab-Grown vs Natural Diamonds India 2026 | Auric Jewels Gurgaon",
  metaDescription: "Lab-grown vs natural diamonds — price, resale value, certification & which to choose. Complete 2026 comparison guide. Certified diamonds at Auric Jewels.",
},
{
  title: "Top 10 Jewellery Trends in India 2026 — What Every Woman Should Own",
  slug: "jewellery-trends-india-2026",
  metaTitle: "Top 10 Jewellery Trends India 2026 | Auric Jewels Gurgaon",
  metaDescription: "Discover the top 10 jewellery trends in India for 2026 — layered necklaces, sculptural earrings, Polki revival & more. Explore trending designs at Auric Jewels.",
},
{
  title: "Gold Jewellery as Investment in 2026 — Why Smart Families Buy Gold in Gurgaon",
  slug: "gold-jewellery-investment-2026-gurgaon",
  metaTitle: "Gold Jewellery Investment 2026 Gurgaon | Auric Jewels Gurgaon",
  metaDescription: "Gold jewellery as investment in 2026 — price trends, BIS hallmark, making charges, resale value & buying guide. Trusted gold jeweller Auric Jewels Gurgaon.",
},
{
  title: "Platinum Jewellery for Men — Chains, Bracelets & Rings Guide Gurgaon",
  slug: "platinum-jewellery-men-gurgaon",
  metaTitle: "Platinum Jewellery Men Chains Rings | Auric Jewels Gurgaon",
  metaDescription: "Explore platinum jewellery for men — chains, bracelets, rings & cufflinks. Durable, hypoallergenic & sophisticated. Shop men's platinum at Auric Jewels Gurgaon.",
},
{
  title: "How to Style Layered Necklaces — Trending Jewellery Looks for Indian Women 2026",
  slug: "layered-necklace-styling-guide-indian-women",
  metaTitle: "Layered Necklace Styling Guide India | Auric Jewels Gurgaon",
  metaDescription: "Master layered necklace styling — rules, combinations, Indian & Western looks. Gold & diamond layering tips for 2026. Shop necklaces at Auric Jewels Gurgaon.",
},
];

// ── Publish single article ──────────────────────────────

async function publishArticle(article) {
  const input = {
    slug: article.slug,
    title: article.title,
    pageType: PAGE_TYPE_ID,
    isPublished: true,
    seo: { title: article.metaTitle, description: article.metaDescription }
  };

  // Try with content if available
  const r = await gql(
    `mutation PageCreate($input: PageCreateInput!) {
      pageCreate(input: $input) {
        page { id slug title }
        errors { field message code }
      }
    }`,
    { input }
  );

  if (r.data?.pageCreate?.page && !r.data?.pageCreate?.errors?.length) {
    return { ok: true, data: r.data.pageCreate.page };
  }
  if (r.data?.pageCreate?.errors?.length) {
    const err = r.data.pageCreate.errors[0];
    return { ok: false, error: `${err.field}: ${err.message} (${err.code})` };
  }
  if (r.errors) return { ok: false, error: r.errors[0].message };
  return { ok: false, error: "Unknown error" };
}

// ── Add metadata type=blog ──────────────────────────────

async function addBlogMetadata(pageId) {
  const r = await gql(
    `mutation UpdateMetadata($id: ID!, $input: [MetadataInput!]!) {
      updateMetadata(id: $id, input: $input) {
        item { metadata { key value } }
        errors { field message }
      }
    }`,
    { id: pageId, input: [{ key: "type", value: "blog" }] }
  );

  if (r.data?.updateMetadata?.errors?.length) {
    return { ok: false, error: r.data.updateMetadata.errors[0].message };
  }
  return { ok: true };
}

// ── Main publish flow ────────────────────────────────────

async function run() {
  btn.disabled = true;
  log.innerHTML = "";
  out("Auric Jewels — Publishing 6 SEO Blog Articles", "info");
  out(`API: ${API}`, "dim");
  out(`Page Type: ${PAGE_TYPE_ID}`, "dim");
  out("", "");

  let ok = 0, fail = 0;

  for (let i = 0; i < ARTICLES.length; i++) {
    const a = ARTICLES[i];
    counter.textContent = `Publishing ${i + 1}/${ARTICLES.length}...`;
    out(`[${i + 1}/${ARTICLES.length}] ${esc(a.title.substring(0, 70))}`, "");
    out(`    Slug: ${a.slug}`, "dim");

    const result = await publishArticle(a);

    if (result.ok) {
      const pageId = result.data?.id;
      out(`    ✔ Page created (ID: ${pageId})`, "ok");

      // Add metadata
      const meta = await addBlogMetadata(pageId);
      if (meta.ok) {
        out(`    ✔ Metadata type=blog added`, "ok");
      } else {
        out(`    ⚠ Metadata failed: ${meta.error}`, "warn");
      }

      out(`    → auricjewels.com/blog/${a.slug}`, "ok");
      ok++;
    } else {
      out(`    ✘ Failed: ${esc((result.error || 'Unknown').substring(0, 250))}`, "fail");
      fail++;
    }

    out("", "");
    await new Promise(r => setTimeout(r, 800));
  }

  out("═".repeat(50), "dim");
  const msg = `Done: ${ok} published, ${fail} failed out of ${ARTICLES.length}`;
  out(msg, ok === ARTICLES.length ? "ok" : "warn");
  counter.textContent = msg;

  if (ok > 0) {
    out("", "");
    out("Published URLs:", "info");
    ARTICLES.forEach(a => {
      out(`  https://www.auricjewels.com/blog/${a.slug}`, "ok");
    });
  }

  btn.disabled = false;
}
</script>
</body>
</html>
