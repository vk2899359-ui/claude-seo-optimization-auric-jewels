// ═══════════════════════════════════════════════════════════
const API="https://auric.thecodemesh.online/graphql/";
const logEl=document.getElementById("log");
const counterEl=document.getElementById("counter");
const btn=document.getElementById("start");
const pbar=document.getElementById("pbar");
const summaryEl=document.getElementById("summary");

function out(msg,cls=""){logEl.innerHTML+=`<div class="${cls}">${msg}</div>`;logEl.scrollTop=logEl.scrollHeight}
function esc(s){return s.replace(/</g,'&lt;').replace(/>/g,'&gt;')}

async function gql(query,variables){
  const token=document.getElementById("token").value.trim();
  const body={query};
  if(variables)body.variables=variables;
  const r=await fetch(API,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+token},body:JSON.stringify(body)});
  return r.json();
}

// ── Load content from file ────────────────────────────────
async function loadContent(filename){
  try{
    const r=await fetch("../content/"+filename);
    if(!r.ok)return null;
    return await r.text();
  }catch(e){return null}
}

// ── Debug: show mutations ─────────────────────────────────
async function debugSchema(){
  logEl.innerHTML="";
  out("Fetching GraphQL schema...","info");
  try{
    const r=await gql(`{__schema{mutationType{fields{name args{name type{name kind ofType{name kind ofType{name}}}}}}}}`);
    if(r.errors){out("Error: "+r.errors[0].message,"fail");return}
    const muts=(r?.data?.__schema?.mutationType?.fields)||[];
    out(`Total mutations: ${muts.length}`,"info");
    const pageRelated=muts.filter(m=>m.name.toLowerCase().includes("page"));
    if(pageRelated.length){
      out("\nPAGE-RELATED MUTATIONS:","warn");
      pageRelated.forEach(m=>{
        const args=m.args.map(a=>`${a.name}: ${a.type.name||(a.type.ofType?.name||'?')}`).join(", ");
        out(`  ${m.name}(${args})`,"ok");
      });
    }
    out("\nALL MUTATIONS:","dim");
    muts.forEach(m=>out(`  ${m.name}`,"dim"));
  }catch(e){out("Network error: "+e.message,"fail")}
}

// ── Find page type ────────────────────────────────────────
async function findPageType(){
  out("Step 1: Finding page types...","info");
  const r=await gql(`{pageTypes(first:20){edges{node{id name slug}}}}`);
  if(r.errors){
    const msg=r.errors[0].message||"";
    if(/permission/i.test(msg)||/MANAGE_PAGES/i.test(msg)){
      out("PERMISSION ERROR: "+msg,"fail");
      out("Your token lacks MANAGE_PAGES. Fix in Saleor dashboard.","fail");
      return"STOP";
    }
    out("pageTypes query failed: "+msg,"fail");
    return null;
  }
  const types=(r?.data?.pageTypes?.edges)||[];
  if(!types.length){out("No page types found. Trying without...","warn");return"SKIP"}
  let best=null;
  types.forEach(({node})=>{
    out(`  Found: "${node.name}" (${node.id})  slug: ${node.slug}`,"dim");
    const n=(node.name||'').toLowerCase()+(node.slug||'').toLowerCase();
    if(/seo|blog|article|post|content/.test(n))best=node;
  });
  if(!best)best=types[0].node;
  out(`Using page type: "${best.name}" (${best.id})`,"info");
  return best.id;
}

// ── Publish single article ────────────────────────────────
async function publishArticle(article,pageTypeId,isDraft){
  const input={
    slug:article.slug,
    title:article.title,
    isPublished:!isDraft,
    seo:{title:(article.title+" | Auric Jewels").substring(0,70),description:article.metaDescription||""}
  };
  if(article.content){
    input.content=JSON.stringify({blocks:[{type:"rawHtml",data:{html:article.content}}]});
  }
  if(pageTypeId&&pageTypeId!=="SKIP"){
    input.pageType=pageTypeId;
  }

  // Pattern 1: with content
  try{
    const r=await gql(`mutation PageCreate($input:PageCreateInput!){pageCreate(input:$input){page{id slug title}errors{field message code}}}`,{input});
    if(r.data?.pageCreate?.page&&!r.data?.pageCreate?.errors?.length){
      return{ok:true,data:r.data.pageCreate.page};
    }
    if(r.data?.pageCreate?.errors?.length){
      const err=r.data.pageCreate.errors[0];
      if(err.field==='content'){
        // Retry without content
        const input2={...input};delete input2.content;
        const r2=await gql(`mutation PageCreate($input:PageCreateInput!){pageCreate(input:$input){page{id slug title}errors{field message code}}}`,{input:input2});
        if(r2.data?.pageCreate?.page&&!r2.data?.pageCreate?.errors?.length){
          return{ok:true,data:r2.data.pageCreate.page,note:"without content"};
        }
        if(r2.data?.pageCreate?.errors?.length){
          return{ok:false,error:r2.data.pageCreate.errors.map(e=>`${e.field}: ${e.message}`).join('; ')};
        }
      }
      return{ok:false,error:`${err.field}: ${err.message} (${err.code})`};
    }
    if(r.errors){return{ok:false,error:r.errors[0].message}}
  }catch(e){}

  // Pattern 2: metadata only
  try{
    const input2={slug:article.slug,title:article.title,isPublished:!isDraft,seo:{title:(article.title+" | Auric Jewels").substring(0,70),description:article.metaDescription||""}};
    if(pageTypeId&&pageTypeId!=="SKIP")input2.pageType=pageTypeId;
    const r=await gql(`mutation PageCreate($input:PageCreateInput!){pageCreate(input:$input){page{id slug title}errors{field message code}}}`,{input:input2});
    if(r.data?.pageCreate?.page&&!r.data?.pageCreate?.errors?.length){
      return{ok:true,data:r.data.pageCreate.page,note:"metadata only"};
    }
    if(r.data?.pageCreate?.errors?.length){
      return{ok:false,error:r.data.pageCreate.errors.map(e=>`${e.field}: ${e.message}`).join('; ')};
    }
    if(r.errors)return{ok:false,error:r.errors[0].message};
  }catch(e){}

  return{ok:false,error:"All mutation patterns failed"};
}

// ── Extract first <p> as meta description ─────────────────
function extractMeta(html){
  const m=html.match(/<p>([\s\S]*?)<\/p>/);
  if(!m)return"";
  const text=m[1].replace(/<[^>]+>/g,'').trim();
  return text.length>155?text.substring(0,152).replace(/\s+\S*$/,'')+'...':text;
}

// ── Main publish flow ─────────────────────────────────────
async function run(){
  btn.disabled=true;
  logEl.innerHTML="";
  summaryEl.style.display="none";
  const isDraft=document.getElementById("mode").value==="draft";
  const modeLabel=isDraft?"DRAFT":"PUBLISHED";
  const total=ARTICLES.length;

  out(`Auric Jewels \u2014 Publishing ${total} Blog Articles as ${modeLabel}`,"info");
  out("API: "+API,"dim");
  out("","");

  // Step 1: Find page type
  const pageTypeId=await findPageType();
  if(pageTypeId==="STOP"){btn.disabled=false;return}
  out("","");

  // Step 2: Try loading content from files, or use title-only
  out("Step 2: Loading article content...","info");
  for(const a of ARTICLES){
    const html=await loadContent(a.file);
    if(html){
      a.content=html;
      a.metaDescription=extractMeta(html);
    }else{
      a.content=null;
      a.metaDescription=a.title+" — Expert guide from Auric Jewels, 201 Greenwood Plaza, Sector 45, Gurugram.";
    }
  }
  const withContent=ARTICLES.filter(a=>a.content).length;
  out(`  Loaded content for ${withContent}/${total} articles`,"dim");
  if(withContent<total)out(`  ${total-withContent} articles will publish metadata only (add content via CMS)`,"warn");
  out("","");

  // Step 3: Publish each
  out(`Step 3: Pushing ${total} articles to Saleor...`,"info");
  out("","");

  let ok=0,fail=0;
  const results=[];

  for(let i=0;i<total;i++){
    const a=ARTICLES[i];
    const pct=Math.round(((i+1)/total)*100);
    pbar.style.width=pct+"%";
    counterEl.textContent=`Publishing ${i+1}/${total}...`;

    const shortTitle=a.title.length>60?a.title.substring(0,57)+"...":a.title;
    out(`[${i+1}/${total}] ${esc(shortTitle)}`,"");

    const result=await publishArticle(a,pageTypeId,isDraft);
    if(result.ok){
      const pid=result.data?.id||"?";
      const note=result.note?` (${result.note})`:"";
      out(`  \u2714 Pushed ${i+1}/${total} \u2014 ID: ${pid} \u2014 /${a.slug}${note}`,"ok");
      ok++;
      results.push({title:a.title,slug:a.slug,id:pid,status:"ok"});
    }else{
      out(`  \u2718 Failed: ${esc((result.error||'Unknown').substring(0,200))}`,"fail");
      fail++;
      results.push({title:a.title,slug:a.slug,id:null,status:"fail",error:result.error});
    }
    await new Promise(r=>setTimeout(r,600));
  }

  // Summary
  pbar.style.width="100%";
  out("","");
  out("\u2550".repeat(55),"dim");
  const msg=`Done: ${ok} pushed, ${fail} failed out of ${total} (${modeLabel})`;
  out(msg,ok===total?"ok":"info");
  counterEl.textContent=msg;

  // Build summary table
  if(ok>0){
    let html=`<h3>\u2714 ${ok} Pages Pushed as ${modeLabel}</h3>`;
    html+="<table><tr><th>#</th><th>Slug</th><th>Saleor Page ID</th></tr>";
    let n=1;
    for(const r of results){
      if(r.status==="ok"){
        html+=`<tr><td>${n++}</td><td>${esc(r.slug)}</td><td>${esc(r.id)}</td></tr>`;
      }
    }
    html+="</table>";
    if(isDraft)html+="<p style='margin-top:.75rem;color:#D4B56A;font-size:.85rem'>All pages are in DRAFT mode. Go to Saleor dashboard to review and publish.</p>";
    summaryEl.innerHTML=html;
    summaryEl.style.display="block";
  }

  if(fail>0){
    out("\nTroubleshooting:","warn");
    out('1. Click "Debug: Show Mutations" to check available mutations',"dim");
    out("2. Verify your token has MANAGE_PAGES permission","dim");
    out("3. Check if slugs already exist (duplicate slug = error)","dim");
  }

  btn.disabled=false;
}
</script>
